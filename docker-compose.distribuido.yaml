  # ---------------------------------------------------------------- borda ---
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    networks:
      default:
      aps-net:
