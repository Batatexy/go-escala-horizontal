        condition: service_healthy
      api-4:
        condition: service_healthy
      api-5:
        condition: service_healthy
      api-6:
        condition: service_healthy

configs:
  esquema_sql:
    content: |
      -- ============================================================
      -- schema.sql — esquema do Cenário B (arquitetura distribuída)
      --
      -- Executado uma única vez pelo próprio contêiner do PostgreSQL, na primeira
      -- inicialização (diretório /docker-entrypoint-initdb.d). Não altera o init.sql
      -- do kit base, que é imutável e continua servindo ao Cenário A.
      --
      -- Diferenças em relação ao esquema do monolito:
      --   * medicoes guarda também temperatura, umidade e o Humidex de cada medição;
      --   * agregados_sensor mantém soma e contagem por sensor, atualizadas na mesma
      --     transação da inserção. A rota de leitura deixa de calcular AVG() sobre
      --     um conjunto de linhas que cresce a cada ingestão.
      -- ============================================================

      CREATE TABLE IF NOT EXISTS medicoes (
          id           BIGSERIAL        PRIMARY KEY,
          sensor_id    TEXT             NOT NULL,
          timestamp    TIMESTAMPTZ      NOT NULL,
          raw_packet   TEXT             NOT NULL,
          hash         TEXT             NOT NULL,
          temperatura  DOUBLE PRECISION NOT NULL,
          umidade      DOUBLE PRECISION NOT NULL,
          humidex      DOUBLE PRECISION NOT NULL,
          criado_em    TIMESTAMPTZ      NOT NULL DEFAULT now(),
          -- Regra de unicidade do contrato: um par (sensor, instante) por linha.
          -- O ON CONFLICT do worker depende desta restrição para ser idempotente.
          CONSTRAINT medicoes_sensor_timestamp_uniq UNIQUE (sensor_id, timestamp)
      );

      CREATE TABLE IF NOT EXISTS agregados_sensor (
          sensor_id  TEXT             PRIMARY KEY,
          soma       DOUBLE PRECISION NOT NULL,
          amostras   BIGINT           NOT NULL CHECK (amostras > 0)
      );
  nginx_conf:
    content: |
      # ============================================================
      # nginx.conf — borda do Cenário B (balanceador de carga)
      #
      # Termina o HTTP na porta 8080 (a única publicada) e distribui as requisições
      # entre as instâncias da API. Gerado por ferramentas/gerar_compose.py: a lista
      # "upstream" acompanha o número de instâncias declarado no compose.
      # ============================================================
      worker_processes 1;
      worker_rlimit_nofile 16384;
      pid /tmp/nginx.pid;
      error_log /dev/stderr warn;

      events {
          worker_connections 8192;
          multi_accept on;
      }

      http {
          access_log off;                 # log por requisição custaria CPU da cota
          server_tokens off;
          sendfile on;
          tcp_nodelay on;

          client_max_body_size 8m;
          client_body_buffer_size 1m;     # lotes de 10 a 60 medições (~5 a 15 KB) ficam em memória
          keepalive_timeout 120s;
          keepalive_requests 100000;

          upstream api {
              # least_conn: a próxima requisição vai para a instância com menos
              # conexões ativas. Com cota de 0.05 vCPU por instância, round-robin
              # puro empilharia trabalho em uma instância já estrangulada pelo CFS.
              least_conn;
              server api-1:8080 max_fails=0;
              server api-2:8080 max_fails=0;
              server api-3:8080 max_fails=0;
              server api-4:8080 max_fails=0;
              server api-5:8080 max_fails=0;
              server api-6:8080 max_fails=0;
              keepalive 128;              # reaproveita conexões nginx -> API
          }

          server {
              listen 8080 backlog=4096;

              location / {
                  proxy_pass http://api;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $$host;
                  proxy_buffering on;

                  proxy_connect_timeout 1s;
                  proxy_send_timeout 10s;
                  proxy_read_timeout 10s;

                  # Se uma instância falhar, outra atende. A ingestão é idempotente
                  # (UNIQUE sensor+timestamp), então repetir um POST é seguro.
                  proxy_next_upstream error timeout http_502 http_503 non_idempotent;
                  proxy_next_upstream_tries 3;
              }
          }
      }

networks:
  aps-net:
    external: true
